<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>116 申請入學選系</title>
<meta name="description" content="116 學年度大學個人申請：用學測級分、模考或目標分數，逐關對照 115 一階篩選結果、查檢定、排六個志願、檢查甄試撞期。離線可用。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161a21" media="(prefers-color-scheme: dark)">
<script>try{var t=(JSON.parse(localStorage.getItem('apply116-v1'))||{}).theme;if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>/*__CSS__*/</style>
</head>
<body>
<a class="skip" href="#main">跳到內容</a>
<header class="appbar">
  <div class="appbar-in">
    <a class="brand" href="#" data-tab="explore" aria-label="116 申請入學選系，回到找校系">
      <span class="mark" aria-hidden="true">116</span>
      <span class="brand-t"><b>申請入學選系</b><small>116 學年度 · 64 校 2,240 校系</small></span>
    </a>
    <nav class="tabs" aria-label="主要功能" id="tabs"></nav>
    <div class="appbar-r">
      <button class="countdown" id="countdown" data-tab="guide" hidden></button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="切換深色或淺色模式" title="切換深色／淺色"></button>
    </div>
  </div>
</header>

<main id="main">
  <section class="view" id="view-scores" aria-label="我的成績" hidden><div class="wrap"><div class="page" id="scores"></div></div></section>
  <section class="view" id="view-explore" aria-label="找校系">
    <div class="wrap explore">
      <section class="rail" id="rail" aria-label="篩選">
        <div class="filter-panel" id="filterPanel"></div>
      </section>
      <div class="results">
        <h1 class="sr">找校系</h1>
        <div id="ctxExplore"></div>
        <div class="toolbar">
          <label class="search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="sr">搜尋校系</span>
            <input id="q" type="search" placeholder="搜尋學校、科系、面試或審查關鍵字" autocomplete="off" enterkeyhint="search">
            <button class="clearq" id="clearQ" type="button" aria-label="清除搜尋" hidden><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
            <kbd aria-hidden="true">/</kbd>
          </label>
          <button class="btn fbtn" id="openFilters" type="button"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg>篩選<span class="count" id="filterCount"></span></button>
          <label class="selectbox"><span class="sr">排序</span>
            <select id="sort">
              <option value="chance">最穩的在前</option>
              <option value="select">最搶手的在前</option>
              <option value="selectLow">最好進的在前</option>
              <option value="sat">依二階學測佔比（高 → 低）</option>
              <option value="satLow">依二階學測佔比（低 → 高）</option>
              <option value="date">依甄試日期（早 → 晚）</option>
              <option value="quota">依名額（多 → 少）</option>
              <option value="code">依校系代碼</option>
            </select>
            <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
          </label>
        </div>
        <div class="active" id="activeFilters" aria-label="目前的篩選"></div>
        <div class="overview" id="overview" aria-live="polite"></div>
        <div class="listbar" id="listbar"></div>
        <ol class="list" id="list" aria-label="校系列表"></ol>
        <div class="loadmore" id="more"></div>
      </div>
    </div>
  </section>
  <section class="view" id="view-plan" aria-label="我的志願" hidden><div class="wrap"><div class="page" id="plan"></div></div></section>
  <section class="view" id="view-boost" aria-label="怎麼進步" hidden><div class="wrap"><div class="page" id="boost"></div></div></section>
  <section class="view" id="view-guide" aria-label="時程與規則" hidden><div class="wrap"><div class="page" id="guide"></div></div></section>
</main>

<nav class="bottomnav" id="bottomnav" aria-label="主要功能"></nav>

<dialog class="drawer" id="detail" aria-labelledby="dTitle">
  <div class="d-head">
    <span class="d-badge" id="dBadge"></span>
    <div><p class="d-school" id="dSchool"></p><h2 id="dTitle"></h2><p class="d-meta" id="dMeta"></p></div>
    <button class="icon-btn" id="dClose" type="button" aria-label="關閉"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="d-body" id="dBody"></div>
  <div class="d-foot" id="dFoot"></div>
</dialog>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle">
  <div class="sheet-h"><h2 id="sheetTitle">篩選</h2><button class="icon-btn" id="sheetClose" type="button" aria-label="關閉"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="sheet-b" id="sheetBody"></div>
  <div class="sheet-f"><button class="btn" id="sheetReset" type="button">重設</button><button class="btn primary" id="sheetDone" type="button">看結果</button></div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="application/octet-stream" id="app-data">/*__DATA__*/</script>
<script>/*__INFLATE__*/</script>
<script>/*__LOGIC__*/</script>
<script>/*__APP__*/</script>
</body>
</html>
